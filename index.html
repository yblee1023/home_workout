<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f1e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12110f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<meta name="apple-mobile-web-app-title" content="홈트 플래너">
<title>홈트 플래너</title>
<style>
/* 레이아웃: 하단 탭 5개 + 한 컬럼 카드 스택, 운동 진행은 전체 화면 플레이어 */
:root{
  --t-press:.12s; --t-std:.2s; --t-screen:.45s; --t-done:.7s; --ease:cubic-bezier(.25,.1,.25,1);
  --bg:#f7f1e8; --surface:#fefaef; --surface2:#eee6dc; --ink:#1d1d1f; --muted:#5a5958; --line:#e6ded3;
  --accent:#0071e3; --accent-ink:#ffffff; --accent-soft:#e8f1fc; --link:#0066cc;
  --blush:#e8f1fc; --blush-ink:#0066cc;
  --ok:#1d7a34; --ok-soft:#e3f3e6; --seg-on:#fefaef; --fig-near:#ebe3d6; --fig-far:#cbc1b2; --fig-ol:#4a453f; --fig-bg:var(--surface); --accent-hover:#0077ed; --warn:#9a5b0b; --bad:#d70015;
  --hot:#0071e3; --hot-ink:#ffffff; --hot-soft:#e8f1fc; --hot-soft-ink:#0066cc;
  --f-body:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
  --f-num:ui-rounded,"SF Pro Rounded","Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12110f; --surface:#1f1d1a; --surface2:#2c2925; --ink:#f7f1e8; --muted:#a8a5a0; --line:#3a3631;
    --accent:#0071e3; --accent-ink:#ffffff; --accent-soft:#0a2540; --link:#2997ff;
    --blush:#0a2540; --blush-ink:#2997ff; --ok:#30d158; --ok-soft:#0f2a17; --seg-on:#57534d; --fig-near:#8f887d; --fig-far:#5f5951; --fig-ol:#0c0b0a; --fig-bg:var(--surface); --warn:#ffd60a; --bad:#ff453a; color-scheme:dark;
    --hot:#2997ff; --hot-ink:#12110f; --hot-soft:#0a2540; --hot-soft-ink:#2997ff;
  }
}
:root[data-theme="dark"]{
  --bg:#12110f; --surface:#1f1d1a; --surface2:#2c2925; --ink:#f7f1e8; --muted:#a8a5a0; --line:#3a3631;
    --accent:#0071e3; --accent-ink:#ffffff; --accent-soft:#0a2540; --link:#2997ff;
    --blush:#0a2540; --blush-ink:#2997ff; --ok:#30d158; --ok-soft:#0f2a17; --seg-on:#57534d; --fig-near:#8f887d; --fig-far:#5f5951; --fig-ol:#0c0b0a; --fig-bg:var(--surface); --warn:#ffd60a; --bad:#ff453a; color-scheme:dark;
    --hot:#2997ff; --hot-ink:#12110f; --hot-soft:#0a2540; --hot-soft-ink:#2997ff;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.47;letter-spacing:-.01em;
  padding-block:10px 104px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3,p{margin:0}
h1{font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.03em;text-wrap:balance}
h2{font-size:22px;font-weight:700;letter-spacing:-.025em;text-wrap:balance}
h3{font-size:17px;font-weight:700}
.eyebrow{font-size:13px;letter-spacing:0;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
.dday{background:var(--blush);color:var(--blush-ink);border-radius:980px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.dday .num{font-size:18px;margin-left:4px}
.card{background:var(--surface);border:0;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.soft{background:var(--accent-soft);border-color:transparent}
.card.blush{background:var(--blush);border-color:transparent;color:var(--blush-ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{border:0;background:var(--surface2);border-radius:980px;padding:11px 18px;font-weight:600;min-height:44px;letter-spacing:-.01em}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.big{min-height:50px;font-size:17px;width:100%}
.btn.ghost{background:transparent;border-color:transparent;color:var(--link);font-weight:500}
.btn.danger{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.btn.sm{padding:8px 14px;min-height:44px;font-size:15px}
.btn[disabled]{opacity:.45}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--surface2);border-radius:980px;padding:7px 14px;min-height:44px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:980px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:980px;padding:9px 6px;min-height:44px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:0}
input[type=number],input[type=date],input[type=search],textarea{border:0;background:var(--surface2);border-radius:12px;padding:10px 12px;min-height:44px;width:100%;color:var(--ink)}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;inline-size:100%;max-inline-size:100%;min-width:0;text-align:left;line-height:1.2}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-width:0}
textarea{min-height:96px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs nav{pointer-events:auto;max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:5px;border-radius:980px;
  background:color-mix(in srgb,var(--surface) 78%,transparent);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);box-shadow:inset 0 0 0 .5px var(--line),0 8px 24px rgba(0,0,0,.08)}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;color:var(--muted);border-radius:980px;font-weight:600;min-height:52px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--link);background:var(--accent-soft)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:0;background:var(--surface2);border-radius:12px;padding:8px 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.day small{font-size:12px;color:var(--muted)}
.day b{font-family:var(--f-num);font-size:18px;line-height:1.1}
.day i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block;margin-top:2px}
.day.plan i{background:var(--accent);opacity:.45}
.day.done i{background:var(--ok);opacity:1}
.day.miss i{background:var(--warn);opacity:1}
.day.today{background:var(--surface);box-shadow:inset 0 0 0 2px var(--accent)}
.list{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:baseline;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .t{font-weight:500;min-width:0}
.list .s{color:var(--muted);font-size:13px;white-space:nowrap;font-family:var(--f-num);font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:980px;background:var(--accent-soft);color:var(--link)}
.tag.w{background:var(--blush);color:var(--blush-ink)}
.tag.g{background:var(--surface2);color:var(--muted)}
.tag.hot{background:var(--hot);color:var(--hot-ink)}
.tag.hot2{background:var(--hot-soft);color:var(--hot-soft-ink);box-shadow:inset 0 0 0 1px var(--hot-soft-ink)}
.tag:empty{display:none}
button.tag{border:0;font-family:inherit;min-height:32px;padding:4px 12px;cursor:pointer}
button.tag.hot2{border:0}
button.tag[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.gq{margin:10px 0 2px;-webkit-appearance:none;appearance:none}
.ib{position:relative;width:28px;height:28px;min-height:28px;border-radius:50%;border:0;background:var(--surface2);color:var(--muted);font-weight:700;font-size:13px;line-height:1;padding:0;flex:none}
.ib::after{content:"";position:absolute;inset:-8px}
.mo{display:block;width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:18px;padding:6px}
.mo svg{display:block;max-height:240px}
.sheetbg.c{align-items:center;padding:0 16px}
.sheetbg.c .sheet{border-radius:18px;padding-bottom:18px}
.bar{height:8px;border-radius:980px;background:var(--surface2);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:980px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat div{display:flex;flex-direction:column;gap:0}
.stat b{font-family:var(--f-num);font-size:28px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat i{aspect-ratio:1;border-radius:8px;background:var(--surface2);display:block}
.heat i.d{background:var(--ok)}
.heat i.p{background:var(--accent-soft)}
.heat i.t{outline:2px solid var(--ink);outline-offset:1px}
.heat small{font-size:12px;color:var(--muted);text-align:center}
details.gx{border-top:1px solid var(--line);padding:0}
details.gx:first-of-type{border-top:0}
details.gx summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;min-height:44px}
details.gx>:not(summary){margin-bottom:10px}
details.gx summary::-webkit-details-marker{display:none}
details.gx summary::after{content:"+";color:var(--muted);font-weight:400}
details.gx[open] summary::after{content:"–"}
.lv{border-left:3px solid var(--line);padding:2px 0 2px 10px;margin-top:10px;display:flex;flex-direction:column;gap:2px}
.lv.on{border-color:var(--accent)}
.lv p{font-size:13px;color:var(--muted)}
.lv .btn{align-self:flex-start;margin-top:4px}
.lv .alt{margin-top:8px;padding:8px 10px;border-radius:12px;background:var(--surface2)}
.lv .alt p{font-size:13px;color:var(--muted)}
.lv .alt b{color:var(--ink)}
.scrollx{overflow-x:auto}
.sheetbg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:80%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.pl{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pl>*{width:100%;max-width:560px;margin-left:auto;margin-right:auto}
.pl-top{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.pl-main{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;justify-content:flex-start;padding:6px 0}
.pl-main>:first-child{margin-top:auto}.pl-main>:last-child{margin-bottom:auto}
.pl-foot{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.pl h1{font-size:28px}
.big-n{font-family:var(--f-num);font-weight:600;font-size:84px;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.ring{position:relative;width:min(62vw,240px,30vh);aspect-ratio:1;margin:0 auto;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--surface2)}
.ring .fg{stroke:var(--link);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px}
.stepper button{width:56px;height:56px;border-radius:50%;border:0;background:var(--surface2);font-size:24px;font-weight:700}
.cues{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:15px}
.brand{display:flex;align-items:center;gap:6px;letter-spacing:0;font-weight:600}
.logo{width:20px;height:20px;border-radius:5px;flex:none;display:block}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:980px;font-size:13px;font-weight:500;z-index:60;max-width:88vw;text-align:center}
@media (prefers-reduced-motion: reduce){.ring .fg{transition:none}}
/* 한국어 줄바꿈: 어절 단위 */
.chips.days{flex-wrap:nowrap;gap:6px}.chips.days .chip{flex:1;min-width:0;padding-left:0;padding-right:0;justify-content:center}
.sheet,.cues,.lv p,.muted,.card,.pl{word-break:keep-all;overflow-wrap:break-word}
.sheet{scroll-padding-top:0}
.sheet>.row:first-child{position:sticky;top:-18px;background:var(--surface);padding:4px 0;z-index:1}
.today-card{gap:16px;padding:24px 20px}
.hero-t{font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.list.ex li{align-items:center;justify-content:flex-start;padding:8px 0}
.list.ex .t{flex:1}
.thumb{width:56px;height:34px;flex:none;border-radius:8px;background:var(--surface2);display:block}
.thumb,.mo{--fig-bg:var(--surface2)}
.figbtn + .ring{width:min(48vw,200px,24vh)}
.plfig{display:block;width:100%;max-width:320px;height:150px;margin:0 auto;padding:12px;background:var(--surface);border-radius:18px;box-sizing:border-box}
.plfig.sm{height:110px;max-width:240px;margin:6px auto 8px}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
/* 누름 반응: 짧고 작게. 움직임 줄이기에서는 끔 */
.btn,.chip,.day,.seg button,.stepper button,.tabs button{transition:transform var(--t-press) var(--ease),background-color var(--t-std)}
.btn:active,.chip:active,.day:active,.seg button:active,.stepper button:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){.btn,.chip,.day,.seg button,.stepper button,.tabs button{transition:none}.btn:active,.chip:active,.day:active,.seg button:active,.stepper button:active{transform:none}}
.btn.del{background:transparent;color:var(--bad);font-weight:500}
.figbtn{position:relative;display:block;width:100%;max-width:320px;margin:0 auto;padding:0;border:0;background:none;border-radius:18px;cursor:pointer;transition:transform var(--t-press) var(--ease)}
.figbtn.sm{max-width:240px;margin:6px auto 8px}.figbtn.sm .plfig{margin:0 auto}
.figbtn:active{transform:scale(.97)}
.figtip{position:absolute;right:10px;bottom:8px;font-size:12px;font-weight:600;color:var(--link)}
.doneflash{position:fixed;left:50%;top:42%;z-index:95;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:var(--ok);display:grid;place-items:center;pointer-events:none;animation:doneflash var(--t-done) var(--ease) forwards}
.doneflash svg{width:52px;height:52px;fill:none;stroke:var(--surface);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;animation:donecheck .3s .1s ease-out forwards}
@keyframes doneflash{0%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:scale(1)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05)}}
@keyframes donecheck{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.figbtn{transition:none}.figbtn:active{transform:none}}
/* 시작 화면: 배경 그리드에 동작들이 차례로 나타나고, 가운데 로고와 시작 버튼 */
.splash{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:20px;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  transition:opacity var(--t-screen) var(--ease),transform var(--t-screen) var(--ease)}
.splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.sp-grid{flex:1;min-height:0;width:100%;max-width:480px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:4px 8px;
  -webkit-mask-image:linear-gradient(#000 90%,transparent);mask-image:linear-gradient(#000 90%,transparent)}
.sp-grid svg{display:block;width:100%;height:100%;min-width:0;min-height:0;opacity:0;transform:translateY(8px);transition:opacity .6s ease,transform .6s ease}
.sp-grid svg.on{opacity:1;transform:none}
.sp-grid .pt{fill:var(--surface);transition:fill var(--t-std) var(--ease)}.sp-grid .pf{stroke:var(--ink);fill:var(--ink);transition:stroke var(--t-std) var(--ease),fill var(--t-std) var(--ease)}.sp-grid g.pf{fill:none}
.sp-grid svg.cur .pt{fill:var(--accent)}.sp-grid svg.cur .pf{stroke:var(--accent-ink)}.sp-grid svg.cur circle.pf{fill:var(--accent-ink)}
.sp-mid{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.sp-mid img{width:72px;height:72px;border-radius:17px}
.sp-mid h1{font-size:28px}
.sp-mid p{color:var(--muted);font-size:17px}
.sp-cap{min-height:20px;font-size:15px;color:var(--link);font-weight:500}
.splash .btn{width:100%;max-width:400px;flex:none}
@media (prefers-reduced-motion: reduce){.splash,.sp-grid svg,.sp-cap{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div><div class="eyebrow brand"><img class="logo" src="assets/logo.svg" alt="" width="20" height="20">홈트 플래너</div><h1 id="ttl">오늘</h1></div>
    <div id="dd"></div>
  </header>
  <main id="view" class="wrap" style="max-width:none"></main>
</div>
<div class="tabs"><nav id="nav"></nav></div>
<div id="layer"></div>
<div id="pop" style="position:relative;z-index:70"></div>
<div id="toast" class="toast" hidden></div>
<div class="splash" id="splash" role="dialog" aria-modal="true" aria-labelledby="sp-t">
  <div class="sp-grid" id="sp-grid" aria-hidden="true"></div>
  <div class="sp-mid">
    <img src="assets/logo.svg" alt="" width="96" height="96">
    <h1 id="sp-t">홈트 플래너</h1>
    <p>집에서, 오늘의 맨몸운동</p>
    <span class="sp-cap" id="sp-cap" aria-live="off"></span>
  </div>
  <button class="btn primary big" id="sp-go">운동 시작</button>
</div>
<script>
/* ===== 운동 라이브러리: 동작 패턴마다 3단계(쉬움/표준/어려움) ===== */

function fitTime(w,m,f,c){
  const T=Number(S.profile.time)||60,lim=T+2;
  let W=w.slice(),M=m.map(i=>Object.assign({},i)),F=f.slice(),C=c.slice();
  const tot=()=>estMin([].concat(W,M,F,C));
  if(tot()<=lim)return {w:W,m:M,f:F,c:C};
  F=[];
  if(tot()>lim&&C.length>2)C=C.slice(0,2);
  for(let pass=0;pass<3;pass++)for(let i=M.length-1;i>=0&&tot()>lim;i--){if(M[i].sets>2)M[i].sets-=1;}
  if(tot()>lim&&W.length>4)W=W.slice(0,4);
  while(tot()>lim&&M.length>3)M.pop();
  if(tot()>lim&&W.length>3)W=W.slice(0,3);
  for(let i=M.length-1;i>=0&&tot()>lim;i--){if(M[i].sets>1&&M[i].sets>2)M[i].sets-=1;}
  if(tot()>lim&&C.length>1)C=C.slice(0,1);
  return {w:W,m:M,f:F,c:C};

const isUni=(p,i)=>{const P=LIB[p];return !!P.uni&&!P.fixed&&i>=(P.from||0);};
function tgtText(it){const u=isUni(it.p,it.idx);return it.k==='t'?((u?'각 ':'')+it.tgt+'초'):((u?'좌우 각 ':'')+it.tgt+'회');}
function estMin(items){let s=0;items.forEach(i=>{const u=isUni(i.p,i.idx)?2:1;const w=i.k==='t'?i.tgt*u:i.tgt*(i.idx>=2&&(i.p==='squat'||i.p==='hinge')?5:3)*u;s+=i.sets*(w+i.rest)+15;});return Math.round(s/60);}

const doneOn=k=>S.logs.filter(l=>l.date===k);
function weekOf(date){const m=monday(date);return Array.from({length:7},(_,i)=>addD(m,i));}
function weekStat(date){
  const today=ymd(new Date());let plan=0,done=0;
  weekOf(date).forEach(d=>{const k=ymd(d),p=planFor(d);if(!p.rest){plan++;if(doneOn(k).length)done++;}else if(doneOn(k).length){plan++;done++;}});
  return {plan,done};
}
function dayState(d){
  const k=ymd(d),t=ymd(new Date()),p=planFor(d);
  if(doneOn(k).length)return 'done';
  if(p.rest)return 'rest';
  return k<t?'miss':'plan';
}

/* ===== 운동 진행 플레이어: 세트 · 휴식 타이머 · 난이도 조절 ===== */
let P=null,AC=null,WL=null;
function unlock(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function beep(f,d){
  try{if(AC){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate(d>.2?250:60);}catch(e){}
}
async function wake(){try{if(navigator.wakeLock&&!WL)WL=await navigator.wakeLock.request('screen');}catch(e){}}
function unwake(){try{if(WL)WL.release();}catch(e){}WL=null;}
document.addEventListener('visibilitychange',()=>{if(P&&document.visibilityState==='visible'){WL=null;wake();}});

function startPlayer(){
  const now=new Date(),pl=planFor(now);if(!pl.ses)return;
  const b=build(pl.ses,now),works=[],seq=[];
  b.items.forEach((it,ii)=>{
    const Q=LIB[it.p];
    for(let s=1;s<=it.sets;s++){
      if(it.k==='t'&&isUni(it.p,it.idx)){works.push({it,ii,s,side:'왼쪽'});works.push({it,ii,s,side:'오른쪽'});}
      else works.push({it,ii,s,side:''});
    }
  });
  works.forEach((w,i)=>{
    seq.push({t:'w',it:w.it,ii:w.ii,s:w.s,side:w.side});
    const nx=works[i+1];
    if(nx){const r=w.side==='왼쪽'?10:w.it.rest;if(r>0)seq.push({t:'r',sec:r,prev:w,next:nx});}
  });
  P={b,seq,i:0,start:Date.now(),rec:[],end:0,total:0,reps:0,exit:false,feel:{},adj0:{},sf:0,tm:null,run:false,lb:0};
  closeSheet();unlock();wake();enter();
}
function enter(){
  clearInterval(P.tm);P.run=false;P.end=0;P.lb=0;
  const s=P.seq[P.i];
  if(s&&s.t==='w')P.reps=s.it.k==='r'?s.it.tgt:0;
  if(s&&s.t==='r'){P.total=s.sec;P.end=Date.now()+s.sec*1000;P.tm=setInterval(tick,250);}
  draw();
}
function tick(){
  if(!P||!P.end)return;
  const s=P.seq[P.i];if(!s)return;
  const left=Math.max(0,Math.ceil((P.end-Date.now())/1000));
  const el=$('#tm'),rg=$('#rg');
  if(el)el.textContent=left;
  if(rg)rg.style.strokeDashoffset=String(283*(1-left/P.total));
  if(left>0&&left<=3&&P.lb!==left){P.lb=left;beep(660,.08);}
  if(left<=0){clearInterval(P.tm);P.end=0;beep(990,.3);if(s.t==='r')advance();else PA.wdone();}
}
function advance(){clearInterval(P.tm);P.i++;enter();}
function ringHtml(txt,total,left){
  return '<div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="45"/><circle class="fg" id="rg" cx="50" cy="50" r="45" stroke-dasharray="283" style="stroke-dashoffset:'+(283*(1-left/total))+'"/></svg><span class="big-n" id="tm">'+txt+'</span></div>';
}

function draw(){
  const s=P.seq[P.i],L=$('#layer');
  const nW=P.seq.filter(x=>x.t==='w').length,dW=P.seq.slice(0,P.i).filter(x=>x.t==='w').length;
  const top=(tagTxt)=>'<div class="pl-top"><div class="row sb"><span class="tag">'+tagTxt+'</span><button class="btn sm ghost" data-a="pexit">종료</button></div><div class="bar"><span style="width:'+Math.round(dW/nW*100)+'%"></span></div></div>';
  let h;
  if(P.exit){
    h='<div class="pl">'+top('일시정지')+'<div class="pl-main" style="text-align:center"><h1>운동을 그만할까요?</h1><p class="muted">지금까지 '+P.rec.length+'세트를 했어요.</p></div><div class="pl-foot"><button class="btn primary big" data-a="pcont">계속하기</button>'+(P.rec.length?'<button class="btn" data-a="psavepart">지금까지 저장하고 종료</button>':'')+'<button class="btn danger" data-a="pdiscard">기록 없이 종료</button></div></div>';
  }else if(!s){
    const reps=P.rec.filter(r=>r.k==='r').reduce((a,r)=>a+r.v,0),min=Math.max(1,Math.round((Date.now()-P.start)/60000));
    h='<div class="pl">'+top('완료')+'<div class="pl-main" style="text-align:center"><div><p class="eyebrow">'+esc(P.b.ses.n)+'</p><h1>수고했어요</h1></div>'+
      '<div class="stat"><div><b>'+min+'</b><span>분</span></div><div><b>'+P.rec.length+'</b><span>세트</span></div><div><b>'+reps+'</b><span>총 반복</span></div></div>'+
      '<div class="f" style="display:flex;flex-direction:column;gap:8px;align-items:center"><span class="muted" style="font-size:13px">오늘 컨디션은 어땠나요?</span><div class="chips">'+[[1,'가벼웠어요'],[2,'적당했어요'],[3,'힘들었어요']].map(o=>'<button class="chip" data-a="sf" data-v="'+o[0]+'" aria-pressed="'+(P.sf===o[0])+'">'+o[1]+'</button>').join('')+'</div></div></div>'+

/* 그림이 그려진 영역(bbox)에 viewBox를 맞춰 동작마다 크기를 고르게 */
function fitBox(v,boxes){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  boxes.forEach(b=>{if(!b.width&&!b.height)return;x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height);});
  if(x0>x1)return;
  const w=x1-x0,h=y1-y0,pd=Math.max(w,h)*.06;
  v.setAttribute('viewBox',(x0-pd).toFixed(1)+' '+(y0-pd).toFixed(1)+' '+(w+2*pd).toFixed(1)+' '+(h+2*pd).toFixed(1));
}
function fitThumbs(){document.querySelectorAll('svg.thumb:not([data-fit])').forEach(v=>{v.dataset.fit=1;if(v.firstChild)fitBox(v,[v.firstChild.getBBox()]);});}
/* 플레이어 동작 그림 루프: #plfig가 화면에 있을 때만 돈다 */
let PF=0;
function plFig(now){
  const v=document.getElementById('plfig');
  if(!v){PF=0;return;}
  if(!v.__m){const an=animFor(v.dataset.p,+v.dataset.i);v.__m={an,mu:musFor(v.dataset.p,+v.dataset.i),fit:fitOf(an),view:'s',ph:.5,floor:1};
    const g=v.firstChild,bx=[];for(let k=0;k<12;k++){v.__m.ph=k/12;g.innerHTML=frameSvg(v.__m,.5);bx.push(g.getBBox());}fitBox(v,bx);
    const b=v.viewBox.baseVal;v.__floor='';void '<line x1="'+b.x+'" x2="'+(b.x+b.width)+'" y1="'+(GY+2.5)+'" y2="'+(GY+2.5)+'" stroke="var(--line)" stroke-width="'+(b.width/110).toFixed(2)+'" stroke-linecap="round"/>';}
  const M=v.__m,still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  M.ph=still?.5:(now%M.an.dur)/M.an.dur;
  v.firstChild.innerHTML=v.__floor+frameSvg(M,.5);
  PF=still?0:requestAnimationFrame(plFig);
}

/* 세트 완료 피드백: 초록 체크가 0.7초 떴다 사라진다. 움직임 줄이기에서는 생략 */
function doneFlash(){
  try{navigator.vibrate&&navigator.vibrate(12);}catch(e){}
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const d=document.createElement('div');d.className='doneflash';d.setAttribute('aria-hidden','true');
  d.innerHTML='<svg viewBox="0 0 24 24"><path d="M6 12.5l4 4L18 8"/></svg>';
  document.body.appendChild(d);setTimeout(()=>d.remove(),750);
}

let delId=-1;
function streakWeeks(){
  const now=new Date();let n=0,w=monday(now);
  const cur=weekStat(now);if(cur.plan>0&&cur.done>=cur.plan)n++;
  for(let i=1;i<=52;i++){
    const d=addD(w,-7*i);if(d<monday(parse(S.profile.start)))break;
    const s=weekStat(d);if(s.plan>0&&s.done>=s.plan)n++;else break;
  }
  return n;
}
function chart(arr,unit){
  if(arr.length<2)return '<p class="muted" style="font-size:13px">'+(arr.length?'최근 '+arr[0].v+unit+' · ':'')+'두 번 이상 기록하면 그래프가 나와요</p>';
  const W=320,H=130,ml=38,mr=14,mt=12,mb=24;
  const vs=arr.map(a=>a.v),mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);
  const pd=Math.max((mx-mn)*.25,.5),lo=mn-pd,hi=mx+pd;
  const t0=parse(arr[0].date).getTime(),t1=parse(arr[arr.length-1].date).getTime(),sp=Math.max(1,t1-t0);
  const X=a=>ml+(parse(a.date).getTime()-t0)/sp*(W-ml-mr),Y=v=>mt+(1-(v-lo)/(hi-lo))*(H-mt-mb);
  const pts=arr.map(a=>X(a).toFixed(1)+','+Y(a.v).toFixed(1)),last=arr[arr.length-1];
  const area='M'+pts[0]+' L'+pts.join(' L')+' L'+X(last).toFixed(1)+','+(H-mb)+' L'+ml+','+(H-mb)+' Z';
  const tk=[mx,(mx+mn)/2,mn].map(v=>'<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(ml-6)+'" y="'+(Y(v)+3).toFixed(1)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+v.toFixed(1)+'</text>').join('');
  return '<div class="scrollx"><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="기록 추이" style="min-width:280px;display:block">'+tk+
    '<path d="'+area+'" fill="var(--accent)" fill-opacity=".12"/><polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+
    arr.map(a=>'<circle cx="'+X(a).toFixed(1)+'" cy="'+Y(a.v).toFixed(1)+'" r="2.6" fill="var(--accent)"/>').join('')+
    '<circle cx="'+X(last).toFixed(1)+'" cy="'+Y(last.v).toFixed(1)+'" r="5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/>'+
    '<text x="'+X(last).toFixed(1)+'" y="'+(Y(last.v)-10).toFixed(1)+'" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)">'+last.v+unit+'</text>'+
    '<text x="'+ml+'" y="'+(H-6)+'" font-size="10" fill="var(--muted)">'+md(parse(arr[0].date))+'</text><text x="'+(W-mr)+'" y="'+(H-6)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+md(parse(last.date))+'</text></svg></div>';
}
function paceMsg(arr){
  if(arr.length<2)return '';
  const a=arr[0],b=arr[arr.length-1],days=dayDiff(parse(a.date),parse(b.date));
  if(days<14)return '<p class="muted" style="font-size:13px">2주 이상 기록이 쌓이면 감량 속도를 알려드려요</p>';
  const r=(b.v-a.v)/a.v*100/(days/7),rs=(r>0?'+':'')+r.toFixed(2)+'%';
  const m=r<-1?'감량 속도가 빠른 편이에요. 근손실이 걱정되면 식사량을 조금 늘려보세요':r<=-.2?'근손실을 줄이며 빼기 좋은 속도예요':r<.2?'체중은 유지 중이에요. 근육이 늘면 체중이 그대로일 수 있으니 허리둘레와 사진도 함께 봐요':'체중이 늘고 있어요. 근육 증가일 수 있지만 허리둘레도 함께 확인해요';
  return '<p style="font-size:13px"><b>주당 '+rs+'</b> · <span class="muted">'+m+'</span></p>';
}

  const W=S.body.filter(b=>b.w).map(b=>({date:b.date,v:b.w})),A2=S.body.filter(b=>b.a).map(b=>({date:b.date,v:b.a})),F=S.body.filter(b=>b.f).map(b=>({date:b.date,v:b.f}));
  h+='<section class="card"><h3>체중</h3>'+chart(W,'kg')+paceMsg(W)+'</section>';
  if(A2.length)h+='<section class="card"><h3>허리둘레</h3>'+chart(A2,'cm')+'</section>';
  if(F.length>1)h+='<section class="card"><h3>체지방률</h3>'+chart(F,'%')+'</section>';
  const recent=S.logs.map((l,i)=>({l,i})).slice(-8).reverse();
  h+='<section class="card"><h3>운동 기록</h3>'+(recent.length?'<ul class="list">'+recent.map(o=>'<li><span class="t">'+md(parse(o.l.date))+' · '+esc(o.l.name)+'<span class="muted" style="display:block;font-size:12px;font-weight:400">'+Math.round(o.l.dur/60)+'분 · '+o.l.sets.length+'세트'+(o.l.feel?' · '+['','가벼움','적당','힘듦'][o.l.feel]:'')+'</span></span><button class="btn sm'+(delId===o.i?' danger':' del')+'" data-a="ldel" data-v="'+o.i+'">'+(delId===o.i?'정말 삭제':'삭제')+'</button></li>').join('')+'</ul>':'<p class="muted" style="font-size:13px">아직 기록이 없어요. 오늘 탭에서 첫 운동을 시작해보세요.</p>')+'</section>';
  return h;
}
